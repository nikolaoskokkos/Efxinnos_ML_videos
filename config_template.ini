; Settings for the Posidonia notebook. The notebook copies this file to config.ini with the
; values chosen in its settings panels; the scripts read config.ini.
; Paths are relative to this folder.

[general]
classes = posidonia_oceanica, rock, debris

[enhance]
; Step 1: remove the water haze and colour cast (0.enhance_video.py, natural method).
; Saves <output_dir>/<video>_enhanced_natural.mp4 (+ a copy of its .srt); the notebook sets
; output_dir to the run's folder, results/<run>/enhancement.
video = input/GX010287_sample.mp4
; Part of the video: seconds (90) or minutes:seconds (1:30). Empty = whole video
start =
end =
; Outside that part: cut = leave it out, keep = copy those frames unchanged
outside = cut
; Fit the water on: all = the whole video, part = only the start - end part
fit_on = part
; The only method here (the full project's script also has motion, physics, seathru and
; trained networks)
method = natural
; Distance to the seabed: srt = flat seabed from the .srt altitude, depth_anything = Depth
; Anything V2 per pixel (slopes, rocks, open water; slower, output gets _depth in its name)
range = srt
depth_model = depth-anything/Depth-Anything-V2-Small-hf
; Camera geometry (GoPro HERO13 4K Wide behind a flat port, portrait): tilt below horizontal,
; vertical / horizontal field of view underwater, in degrees
tilt = 64
vfov = 75.3
hfov = 46.2
; Altitude in metres when the video has no .srt file
altitude = 5
; Also correct the colour for camera depth (imm. in the .srt)
depth_correction = yes
; Frames sampled across the video to fit the water
calib_frames = 60
; 1 = full correction, 0.5 = half way between original and corrected
strength = 1.0
; Longest side of the saved video in pixels
output_max = 1920
; Brightness of sand / pale rock (Lab L, 0-100)
sand_brightness = 80
; How much haze is removed: 1 = as fitted, above 1 = clearer but the darkest seagrass turns
; black / grey-purple, below 1 = softer
haze = 1.0
; Caps how much the colour may change with distance (per channel), so the far top of the
; frame does not turn yellow / orange; 0 or 1 = off (default), 1.3 = mild cap
far_colour_limit = 0
; Keep the shadows and the seagrass from turning mauve / pink
shadow_balance = yes
; Frames with less contrast than usual get less correction (open water)
contrast_fade = 0.2, 0.45
; The correction fades out between these altitudes (m); empty = off
altitude_fade = 6, 10
; Even out quick brightness / colour flicker (sunlight waves on the seabed in shallow water)
deflicker = no
; Bring the pale surfaces of each scene back to beige, slowly, at most scene_max per channel
scene_balance = no
scene_max = 1.3
; Particle removal: the floating particles (the correction turns them into orange streaks).
; yes / no
remove_particles = no
; How they are removed:
;   median = lines up the frames before and after each frame (same seabed, the particles have
;            drifted) and takes the middle value of every pixel: most removed (GX010175: ~9 in 10
;            moving particles), slightly softer seabed, fish fade; ~3x slower. Output: _pmedian5
;   bright = the same frames, but only what is brighter than in them is replaced: sharper seabed,
;            more particles left; ~3x slower. Output: _pbright5
;   blur   = streaks found in the frame itself, filled with the colour around them: fast, can
;            leave smudges. Output: _pblur
particle_method = median
; median / bright: frames combined (5 = 2 before + 2 after)
particle_frames = 5
; bright: brightness (0-255) above the neighbours that counts as a particle (10 leaves faint
; streaks that the correction turns into thin orange lines), and how far around each one is
; replaced too (px)
particle_step = 5
particle_grow = 9
; Distance colour balance: gives the far (top) part the colour, brightness and fine detail of the
; near seabed, measured on pale textured surfaces (sand, rock); 0 = off, 1 = full
range_balance = 1.0
; Local contrast: brings out texture (CLAHE on brightness), 0 = off, 2 = clearly sharper;
; the output gets _lc<value> in its name
local_contrast = 0
output_dir =
; yes = only save the fit chart and a before/after preview (fast)
preview_only = no

[detect]
; Step 2: detect the seagrass (detect_video.py)
video = input/GX010287_sample_enhanced_natural.mp4
model = v8
; Minimum confidence (0 to 1)
conf = 0.40
; Longest side of the saved video in pixels
save_max = 1080
; How strongly the detected areas are coloured: 0 = only the outline, 1 = solid colour
opacity = 0.3
; Colour boost of the saved video and the live view (the model always sees the original frame): 1 = unchanged (default), 1.3 = livelier, 0 = black and white
saturation = 1.0
; Run the model on every n-th frame (the saved video then has fps / n frames per second)
every_frames = 2
; Live view in the notebook: show the latest annotated frame every this many analysed frames (0 = off)
live_every = 3

[coverage]
; Step 3: coverage map (6.make_coverage_map.py). Empty = as in [detect] / [enhance]
video =
model =
conf =
; Classes to map; classes the chosen model doesn't know (debris: only v12, v13) are skipped
classes = posidonia_oceanica, rock, debris
; Seconds between analysed frames
every = 0.5
tilt =
vfov =
hfov =
; Direction the camera looks: track = direction of travel from the GPS, or a compass value
heading = track
heading_offset = 0
; Metres the camera is behind the GPS antenna
layback = 0
; Only map pixels up to this distance from the camera (m)
max_range = 8
; Grid cell size (m)
cell = 0.25
; Cells seen in fewer frames than this stay empty
min_views = 3
; A cell belongs to a class when at least this % of the frames that saw it found that class
threshold = 50
; Polygons smaller than this (m2) are dropped
min_area = 1
; ... per class (class: m2, comma separated); a tyre is ~0.3 m2, so debris needs a smaller one
class_min_area = debris: 0.1
